name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: options from the commit message
        id: opt
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -q '\[test'; then echo "gametest=true" >> $GITHUB_OUTPUT; fi
          SC=$(echo "$MSG" | grep -o '\[test:[^]]*\]' | head -1 | sed 's/^\[test://;s/\]$//')
          echo "scenes=$SC" >> $GITHUB_OUTPUT
          if echo "$MSG" | grep -q '\[probe\]'; then echo "probe=$(tr '\n' ' ' < .github/probe.txt)" >> $GITHUB_OUTPUT; fi
      - name: build
        id: build
        continue-on-error: true
        run: ./gradlew build compileGametestJava --stacktrace --warning-mode=none 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}
      - name: probe signatures
        if: ${{ steps.opt.outputs.probe != '' }}
        env:
          PROBE: ${{ steps.opt.outputs.probe }}
        run: |
          ./gradlew exportDevkit --no-configuration-cache -q || true
          CP=$(find build/devkit/cp -name '*.jar' | tr '\n' ':')
          : > probe.txt
          for c in $PROBE; do
            if [[ $c == pkg:* ]]; then
              p=${c#pkg:}; p=${p//./\/}
              echo "=== package $p" >> probe.txt
              for j in $(find build/devkit/cp -name '*.jar'); do jar tf "$j" 2>/dev/null | grep -E "^$p/[^/]+\.class$" | grep -v '\$' ; done | sort -u | sed 's/\.class$//;s/\//./g' >> probe.txt
            elif [[ $c == res:* ]]; then
              q=${c#res:}
              for j in $(find build/devkit/cp ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null); do
                for e in $(unzip -Z1 "$j" 2>/dev/null | grep -E "^$q" | head -80); do
                  echo "=== res $e ($(basename $j))" >> probe.txt
                  unzip -p "$j" "$e" >> probe.txt 2>/dev/null
                  echo >> probe.txt
                done
              done
            elif [[ $c == code:* ]]; then
              q=${c#code:}
              echo "=== code $q" >> probe.txt
              javap -c -p -cp "$CP" "$q" >> probe.txt 2>&1 || true
            elif [[ $c == find:* ]]; then
              q=${c#find:}
              echo "=== find $q" >> probe.txt
              for j in $(find build/devkit/cp -name '*.jar'); do jar tf "$j" 2>/dev/null | grep -iE "$q" | grep '\.class$'; done | sort -u | head -80 >> probe.txt
            else
              echo "=== $c" >> probe.txt
              javap -p -cp "$CP" "$c" >> probe.txt 2>&1 || true
            fi
          done
      - name: in-game test
        if: ${{ steps.opt.outputs.gametest }}
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: "null"
          MEDIEVAL_SCENES: ${{ steps.opt.outputs.scenes }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" glxinfo -B 2>&1 | head -20 > glxinfo.txt || true
          cat glxinfo.txt
          # A hung game: when its log has been quiet for five minutes, every thread's stack and the heap are written
          # down and the game is stopped (rather than waiting out the whole time limit).
          mkdir -p /tmp/out
          ( while sleep 60; do
              L=$(find . -path ./.gradle -prune -o -name 'latest.log' -path '*logs*' -print 2>/dev/null | head -1)
              [ -n "$L" ] || continue
              AGE=$(( $(date +%s) - $(stat -c %Y "$L") ))
              if [ "$AGE" -gt 300 ]; then
                for P in $(pgrep -x java); do
                  grep -q devlaunchinjector /proc/$P/cmdline 2>/dev/null || continue
                  echo "== pid $P, log quiet for $AGE s" >> /tmp/out/hang-dump.txt
                  jcmd "$P" Thread.print >> /tmp/out/hang-dump.txt 2>&1 || true
                  jcmd "$P" GC.heap_info >> /tmp/out/hang-dump.txt 2>&1 || true
                  kill "$P" || true
                  # A stuck server can hold up the game's own shutdown: then it is killed outright.
                  sleep 30
                  kill -9 "$P" 2>/dev/null || true
                done
                break
              fi
            done ) &
          timeout 160m xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace 2>&1 | tail -400 > gametest-log.txt || true
          # The game's assets come from Mojang's servers; a failed download is retried once.
          if grep -q "Failed to download" gametest-log.txt; then
            sleep 20
            timeout 160m xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace 2>&1 | tail -400 > gametest-log.txt || true
          fi
          mkdir -p /tmp/out/screens
          find . -path ./.gradle -prune -o -name '*.png' -path '*screenshots*' -print -exec cp {} /tmp/out/screens/ \;
          find . -path ./.gradle -prune -o -name 'latest.log' -path '*logs*' -print | head -3
          LOG=$(find . -path ./.gradle -prune -o -name 'latest.log' -path '*logs*' -print | head -1)
          [ -n "$LOG" ] && cp "$LOG" /tmp/out/game-latest.log || true
          # A long run's log can pass GitHub's 100 MB file limit: keep the RESULT lines plain, the whole log packed.
          if [ -f /tmp/out/game-latest.log ] && [ $(stat -c%s /tmp/out/game-latest.log) -gt 40000000 ]; then
            grep -a "RESULT\|SUMMARY\|Exception\|ERROR" /tmp/out/game-latest.log > /tmp/out/game-results.log || true
            gzip -9 /tmp/out/game-latest.log
            ls -la /tmp/out/game-latest.log.gz
          fi
          cp gametest-log.txt glxinfo.txt /tmp/out/ || true
      - name: publish results to a ci-* branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build-log.txt /tmp/out/ 2>/dev/null || true
          cp probe.txt /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          find ~/.gradle/caches/modules-2 -name 'fabric-api-*+*.jar' ! -name '*sources*' -path '*net.fabricmc.fabric-api/fabric-api/*' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > /tmp/out/STATUS
          # Separate result branches, so a probe or a plain build never overwrites in-game test results.
          BR=ci-out
          if [ -n "${{ steps.opt.outputs.probe }}" ]; then BR=ci-probe; elif [ "${{ steps.opt.outputs.gametest }}" = "true" ]; then BR=ci-test; fi
          cd /tmp/out
          git init -q -b "$BR"
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "ci output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BR"
      - name: fail if build failed
        if: ${{ steps.build.outcome != 'success' }}
        run: exit 1
